[project]
name = "harness-lab"
version = "0.0.0"
description = "The harness-lab repo: one shared factory and the projects it builds."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

# The root is not a package: it holds the factory's scripts (factory/) and runs
# every project's tests. Each project has its own pyproject.toml.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "projects/harness/tests"]
# The factory's scripts live in factory/ at the repo root; the harness package
# lives in projects/harness/src. The tests import both from there.
# Adding a project under projects/<name>/ means adding its tests to testpaths
# and its src to pythonpath here.
pythonpath = [".", "projects/harness/src"]
