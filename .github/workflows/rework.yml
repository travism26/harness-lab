# The factory's rework round (docs/factory/README.md).
#
# Review, or .github/workflows/ci-gate.yml, labels a blocked factory PR `rework` with the App's
# token, and that label event starts this workflow (a label added with
# GITHUB_TOKEN would start nothing). The agent fixes what the review named on
# the PR's branch, including a CI failure in that comment. The push starts
# Review again. The same counter covers both: after two rounds, the next
# blocker hands the PR to a human.
#
# pull_request_target, so this file and the factory's scripts come from the
# default branch. Only factory/* branches of this repository qualify; forks never
# reach the job. The agent edits the PR's branch under work/.

name: Rework

on:
  pull_request_target:
    types: [labeled]

permissions: {}

concurrency:
  # One round per PR, never cancelled, and it shares nothing with other PRs'
  # rounds. Keep this condition identical to the job's `if:` below.
  group: >-
    ${{
      (github.event.label.name == 'rework'
        && github.event.pull_request.head.repo.full_name == github.repository
        && startsWith(github.event.pull_request.head.ref, 'factory/')
        && (github.event.sender.type == 'Bot' || github.event.sender.login == github.repository_owner)
        && !contains(github.event.pull_request.labels.*.name, 'ready-for-human'))
      && format('rework-{0}', github.event.pull_request.number)
      || format('rework-ignored-{0}', github.run_id)
    }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: "2.1.319"
  LOGIN: ${{ vars.FACTORY_CLAUDE_LOGIN || 'subscription' }}

jobs:
  rework:
    # The `rework` label, added by the factory App (or the owner by hand), on
    # a factory PR of this repository that no human has taken over.
    if: >-
      github.event.label.name == 'rework'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'factory/')
      && (github.event.sender.type == 'Bot' || github.event.sender.login == github.repository_owner)
      && !contains(github.event.pull_request.labels.*.name, 'ready-for-human')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the daily run cap, and the wait below, read workflow runs
      issues: read # the wait reads the PR comments with this token, not the App token
      pull-requests: read
    steps:
      - name: Check out the factory (default branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Preflight (configuration, daily cap, App token)
        id: preflight
        uses: ./.github/actions/factory-preflight
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          login: ${{ env.LOGIN }}
          subscription-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          openrouter-key: ${{ secrets.OPENROUTER_API_KEY }}
          daily-run-cap: ${{ vars.FACTORY_DAILY_RUN_CAP || '20' }}

      - uses: astral-sh/setup-uv@v10.3.3

      # Review may have charged this round before CI finished. Wait so revise
      # reads a CI failure posted for this head, instead of starting a second round.
      - name: Wait for CI on this head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          uv run --no-dev python -m factory.ci_gate wait --repo "$REPO" --pr "$PR"
          --sha "$SHA" --timeout 1200 --interval 15 --failure-grace 120

      - name: Read the PR, its Ticket and the blockers for this head
        env:
          GH_TOKEN: ${{ steps.preflight.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          APP_SLUG: ${{ steps.preflight.outputs.app-slug }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          uv run --no-dev python -m factory.ticket revise --repo "$REPO" --pr "$PR"
          --out run-out --login "$LOGIN" --app-slug "$APP_SLUG" --run-url "$RUN_URL"

      - name: Check out the PR's branch for the agent
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: work
          persist-credentials: false

      - name: Read the Ticket's Project
        id: project
        run: |
          echo "name=$(jq -r .project run-out/context.json)" >> "$GITHUB_OUTPUT"
          echo "bootstrap=$(jq -r .bootstrap run-out/context.json)" >> "$GITHUB_OUTPUT"

      # The same conditional step .github/workflows/ci.yml has: Go for a Project with a go.mod,
      # at the version its `go` line names.
      - uses: actions/setup-go@v7.0.0
        if: hashFiles(format('work/projects/{0}/go.mod', steps.project.outputs.name)) != ''
        with:
          go-version-file: work/projects/${{ steps.project.outputs.name }}/go.mod
          cache-dependency-path: work/projects/${{ steps.project.outputs.name }}/go.sum

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Rework (agent, budget-capped, no GitHub token)
        id: build
        env:
          FACTORY_SUBSCRIPTION_TOKEN: ${{ env.LOGIN == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          FACTORY_OPENROUTER_KEY: ${{ env.LOGIN == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          MODEL: ${{ vars.FACTORY_BUILD_MODEL || 'sonnet' }}
          BUDGET_USD: ${{ vars.FACTORY_BUILD_BUDGET_USD || '5' }}
        run: >-
          uv run --no-dev python -m factory.ticket build --out run-out --work work
          --login "$LOGIN" --model "$MODEL" --max-budget-usd "$BUDGET_USD"

      # Bootstrap only. The label row is on the base, so this round can start
      # before the new check has merged; the script runs from the PR branch
      # checked out under work/. Go matches .github/workflows/ci.yml. The step
      # holds neither the App token nor the Claude login. A missing or failing
      # check fails the job, so the push does not run.
      - name: Install Go for the new Project
        if: >-
          steps.project.outputs.bootstrap == 'true'
          && hashFiles(format('work/projects/{0}/go.mod', steps.project.outputs.name)) != ''
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: work/projects/${{ steps.project.outputs.name }}/go.mod
          cache-dependency-path: work/projects/${{ steps.project.outputs.name }}/go.sum

      - name: Run the new Project check
        id: verify
        if: steps.project.outputs.bootstrap == 'true'
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          FACTORY_SUBSCRIPTION_TOKEN: ""
          FACTORY_OPENROUTER_KEY: ""
        run: >-
          uv run --no-dev python -m factory.ticket verify --out run-out --work work

      - name: Commit and push the round (Review runs on the push)
        id: publish
        env:
          GH_TOKEN: ${{ steps.preflight.outputs.token }}
          APP_SLUG: ${{ steps.preflight.outputs.app-slug }}
        run: >-
          uv run --no-dev python -m factory.ticket publish --out run-out --work work
          --app-slug "$APP_SLUG"

      # Label the PR when the round failed, so the label list shows it. `revise` removes
      # the label at the next start. The App token adds it, as Implement's failure step does.
      - name: Mark the PR after a failure
        if: failure() && steps.preflight.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.preflight.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: >-
          uv run --no-dev python -m factory.ticket fail-pr --repo "$REPO" --pr "$PR"

      # Runs after the agent step started, whatever happened, and holds the App token.
      # It takes the run's identity from this workflow's context (the event's pull
      # request and its labels when the run started), never from run-out/, and runs only
      # the factory's own scripts. It adds no secret and no model call.
      - name: Leave the run record
        if: always() && steps.build.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ steps.preflight.outputs.token }}
          APP_SLUG: ${{ steps.preflight.outputs.app-slug }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROJECT: ${{ steps.project.outputs.name }}
          # Set here, not read from the job's env: a step that can write $GITHUB_ENV
          # could change the job's value before this step runs.
          LOGIN: ${{ vars.FACTORY_CLAUDE_LOGIN || 'subscription' }}
          MODEL: ${{ vars.FACTORY_BUILD_MODEL || 'sonnet' }}
          BUDGET_USD: ${{ vars.FACTORY_BUILD_BUDGET_USD || '5' }}
          JOB_STATUS: ${{ job.status }}
          AGENT_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: >-
          uv run --no-dev python -m factory.run_record write --workflow rework
          --out run-out --repo "$REPO" --run-id "$RUN_ID" --attempt "$ATTEMPT"
          --issue "${HEAD_REF#factory/issue-}" --pr "$PR" --pr-labels "$PR_LABELS"
          --project "$PROJECT" --login "$LOGIN" --model "$MODEL"
          --budget "$BUDGET_USD" --claude-code-version "$CLAUDE_CODE_VERSION"
          --app-slug "$APP_SLUG" --run-url "$RUN_URL" --job-status "$JOB_STATUS"
          --agent-outcome "$AGENT_OUTCOME" --verify-outcome "$VERIFY_OUTCOME"
          --publish-outcome "$PUBLISH_OUTCOME"

      - name: Keep the run's files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rework-pr${{ github.event.pull_request.number }}-run${{ github.run_id }}-${{ github.run_attempt }}
          path: run-out/
          if-no-files-found: ignore
