# The factory's build step (docs/factory/README.md).
#
# Turns a Ticket into a draft PR when the factory App adds `factory:start`.
# The owner adding that label does nothing, and so does anyone else: the sender
# login must be `{repository_owner}-factory[bot]` (docs/adr/0005). One Ticket at
# a time: `claim` refuses while another open Ticket holds the lock.
#
# As in review.yml, the steps holding the App token run no agent, and the
# agent step holds no GitHub token. The agent edits a separate checkout under
# work/; the factory's own scripts run from the default branch at the root.

name: Implement

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  # One Ticket at a time, never cancelled. Events the job skips get a
  # throwaway group so they cannot displace a waiting run. Keep this condition
  # identical to the job's `if:` below.
  group: >-
    ${{
      (github.event.label.name == 'factory:start'
        && github.event.sender.login == format('{0}-factory[bot]', github.repository_owner)
        && !github.event.issue.pull_request)
      && 'factory-ticket'
      || format('implement-ignored-{0}', github.run_id)
    }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: "2.1.319"
  LOGIN: ${{ vars.FACTORY_CLAUDE_LOGIN || 'subscription' }}

jobs:
  implement:
    # Only the factory App's `factory:start` on an issue (not a pull request).
    if: >-
      github.event.label.name == 'factory:start'
      && github.event.sender.login == format('{0}-factory[bot]', github.repository_owner)
      && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the daily run cap counts this workflow's runs
    steps:
      - name: Check out the factory (default branch)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preflight (configuration, daily cap, App token)
        id: preflight
        uses: ./.github/actions/factory-preflight
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          login: ${{ env.LOGIN }}
          subscription-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          openrouter-key: ${{ secrets.OPENROUTER_API_KEY }}
          daily-run-cap: ${{ vars.FACTORY_DAILY_RUN_CAP || '20' }}

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Claim the Ticket (open, switch rule, one at a time)
        id: claim
        env:
          GH_TOKEN: ${{ steps.preflight.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          APP_SLUG: ${{ steps.preflight.outputs.app-slug }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          uv run --no-dev python -m factory.ticket claim --repo "$REPO" --issue "$ISSUE"
          --out run-out --login "$LOGIN" --app-slug "$APP_SLUG" --run-url "$RUN_URL"

      - name: Check out the code the agent edits
        uses: actions/checkout@v7
        with:
          path: work
          persist-credentials: false

      - name: Read the Ticket's Project
        id: project
        run: |
          echo "name=$(jq -r .project run-out/context.json)" >> "$GITHUB_OUTPUT"
          echo "bootstrap=$(jq -r .bootstrap run-out/context.json)" >> "$GITHUB_OUTPUT"

      # The same conditional step .github/workflows/ci.yml has: Go for a Project with a go.mod,
      # at the version its `go` line names.
      - uses: actions/setup-go@v7.0.0
        if: hashFiles(format('work/projects/{0}/go.mod', steps.project.outputs.name)) != ''
        with:
          go-version-file: work/projects/${{ steps.project.outputs.name }}/go.mod
          cache-dependency-path: work/projects/${{ steps.project.outputs.name }}/go.sum

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Build (agent, budget-capped, no GitHub token)
        id: build
        env:
          # Only the secret the login needs reaches this step.
          FACTORY_SUBSCRIPTION_TOKEN: ${{ env.LOGIN == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          FACTORY_OPENROUTER_KEY: ${{ env.LOGIN == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          MODEL: ${{ vars.FACTORY_BUILD_MODEL || 'sonnet' }}
          BUDGET_USD: ${{ vars.FACTORY_BUILD_BUDGET_USD || '5' }}
        run: >-
          uv run --no-dev python -m factory.ticket build --out run-out --work work
          --login "$LOGIN" --model "$MODEL" --max-budget-usd "$BUDGET_USD"

      # Bootstrap only, and only after Build: go.mod did not exist when the earlier
      # setup-go step ran. Same action and inputs as .github/workflows/ci.yml,
      # pointed at the agent's checkout under work/.
      - name: Install Go for the new Project
        if: >-
          steps.project.outputs.bootstrap == 'true'
          && hashFiles(format('work/projects/{0}/go.mod', steps.project.outputs.name)) != ''
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: work/projects/${{ steps.project.outputs.name }}/go.mod
          cache-dependency-path: work/projects/${{ steps.project.outputs.name }}/go.sum

      # Secret-free. The script may have been written by the agent, so this step
      # gets neither the App token nor the Claude login. A failing check does not
      # fail the job: Publish still opens the draft, the result goes in the Run
      # record, and CI's red run starts a Rework round. Only a bootstrap with no
      # check fails here.
      - name: Run the check
        id: verify
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          FACTORY_SUBSCRIPTION_TOKEN: ""
          FACTORY_OPENROUTER_KEY: ""
        run: >-
          uv run --no-dev python -m factory.ticket verify --out run-out --work work

      - name: Commit, push and open the draft PR
        id: publish
        env:
          GH_TOKEN: ${{ steps.preflight.outputs.token }}
          APP_SLUG: ${{ steps.preflight.outputs.app-slug }}
        run: >-
          uv run --no-dev python -m factory.ticket publish --out run-out --work work
          --app-slug "$APP_SLUG"

      - name: Hand the Ticket back after a failure
        if: failure() && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.preflight.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          uv run --no-dev python -m factory.ticket release --repo "$REPO" --issue "$ISSUE"
          --out run-out --run-url "$RUN_URL"

      # Runs after the agent step started, whatever happened, and holds the App token.
      # It takes the run's identity from this workflow's context, never from run-out/,
      # and runs only the factory's own scripts. It adds no secret and no model call.
      - name: Leave the run record
        if: always() && steps.build.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ steps.preflight.outputs.token }}
          APP_SLUG: ${{ steps.preflight.outputs.app-slug }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROJECT: ${{ steps.project.outputs.name }}
          # Set here, not read from the job's env: a step that can write $GITHUB_ENV
          # could change the job's value before this step runs.
          LOGIN: ${{ vars.FACTORY_CLAUDE_LOGIN || 'subscription' }}
          MODEL: ${{ vars.FACTORY_BUILD_MODEL || 'sonnet' }}
          BUDGET_USD: ${{ vars.FACTORY_BUILD_BUDGET_USD || '5' }}
          JOB_STATUS: ${{ job.status }}
          AGENT_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: >-
          uv run --no-dev python -m factory.run_record write --workflow implement
          --out run-out --repo "$REPO" --run-id "$RUN_ID" --attempt "$ATTEMPT"
          --issue "$ISSUE" --project "$PROJECT" --login "$LOGIN" --model "$MODEL"
          --budget "$BUDGET_USD" --claude-code-version "$CLAUDE_CODE_VERSION"
          --app-slug "$APP_SLUG" --run-url "$RUN_URL" --job-status "$JOB_STATUS"
          --agent-outcome "$AGENT_OUTCOME" --verify-outcome "$VERIFY_OUTCOME"
          --publish-outcome "$PUBLISH_OUTCOME"

      - name: Keep the run's files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: implement-issue${{ github.event.issue.number }}-run${{ github.run_id }}-${{ github.run_attempt }}
          path: run-out/
          if-no-files-found: ignore
