# The factory's review step (docs/factory/README.md).
#
# A fresh-context, two-axis review (Spec, Standards) of every pull request from
# a branch of this repository, draft or not. It posts its report on the PR. On
# a Spec blocker it labels the PR `rework` and counts the round with
# `rework:1`..`rework:2`; the blocker after rework:2 labels it factory-stopped
# and the factory stops. A CI failure on the same head shares that counter
# (.github/workflows/ci-gate.yml): this step does not open a second round for it. It never
# approves and never merges.
#
# A PR labelled `factory-stopped` is still reviewed on each push, but Review
# changes no labels on it (factory/review_pr.py). Rework and the CI gate skip it.
#
# PRs from forks are never reviewed here: this workflow holds secrets, and fork
# PRs never get them (docs/adr/0005). CI still runs their tests without secrets.
#
# Three steps keep the agent away from GitHub: `prepare` and `apply` hold the
# App token and run no agent; `review` runs the agent with the Claude login
# only, no shell, no write tools and a dollar cap.
#
# No `|| true` anywhere, on purpose. A step that cannot do its job fails the
# run, so a red run says the brake did not engage and a green one says it did.

name: Review

# pull_request_target, not pull_request: the workflow file and the factory's
# scripts always come from the default branch, so a PR cannot rewrite the brake
# that judges it. The PR's code is checked out under pr/ as data and never run.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  # One review running and at most one pending per PR, and a review in flight
  # is never cancelled. Events the job skips (forks) get a
  # throwaway group of their own so they can never displace a pending review.
  # Keep this condition identical to the job's `if:` below.
  group: >-
    ${{
      github.event.pull_request.head.repo.full_name == github.repository
      && format('review-{0}', github.event.pull_request.number)
      || format('review-ignored-{0}', github.run_id)
    }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: "2.1.319"
  LOGIN: ${{ vars.FACTORY_CLAUDE_LOGIN || 'subscription' }}

jobs:
  review:
    # PRs from a branch of this repository (never a fork), including one
    # labelled `factory-stopped`: Review still reads its pushes and posts a
    # report, and moves no labels there. Pushing a branch here needs write access.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # the daily run cap counts this workflow's runs
    steps:
      # The factory's scripts come from the default branch, so a PR cannot change
      # the code judging it. The PR's own code goes under pr/.
      - name: Check out the factory (default branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Preflight (configuration, daily cap, App token)
        id: preflight
        uses: ./.github/actions/factory-preflight
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          login: ${{ env.LOGIN }}
          subscription-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          openrouter-key: ${{ secrets.OPENROUTER_API_KEY }}
          # Review has its own cap: it runs on every push to every PR. Over the cap, the
          # run goes on only far enough to say so on the PR, then fails.
          daily-run-cap: ${{ vars.FACTORY_REVIEW_DAILY_RUN_CAP || '40' }}
          cap-variable: FACTORY_REVIEW_DAILY_RUN_CAP
          continue-on-cap: "true"

      - uses: astral-sh/setup-uv@v10.3.3

      # The App token posts it; GITHUB_TOKEN has no write permission. The comment has no review
      # marker, so nothing reads it as a verdict. Once per head.
      - name: Say on the PR that the daily cap stopped this review
        if: steps.preflight.outputs.capped == 'true'
        env:
          GH_TOKEN: ${{ steps.preflight.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CAP: ${{ vars.FACTORY_REVIEW_DAILY_RUN_CAP || '40' }}
        run: >-
          uv run --no-dev python -m factory.review_pr capped --repo "$REPO" --pr "$PR"
          --head-sha "$HEAD_SHA" --cap "$CAP" --variable FACTORY_REVIEW_DAILY_RUN_CAP

      - name: Stop, red, because the daily cap was reached
        if: steps.preflight.outputs.capped == 'true'
        run: |
          echo "::error title=Daily run cap reached::Review did not run for this head. Raise FACTORY_REVIEW_DAILY_RUN_CAP or wait for tomorrow, then re-run this job."
          exit 1

      - name: Check out the pull request (read by the reviewer, never run)
        if: steps.preflight.outputs.capped != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Install Claude Code
        if: steps.preflight.outputs.capped != 'true'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Gather the diff and the Ticket, and check the switch rule
        if: steps.preflight.outputs.capped != 'true'
        env:
          GH_TOKEN: ${{ steps.preflight.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APP_SLUG: ${{ steps.preflight.outputs.app-slug }}
        run: >-
          uv run --no-dev python -m factory.review_pr prepare --repo "$REPO" --pr "$PR"
          --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --code-dir pr --out review-out
          --login "$LOGIN" --app-slug "$APP_SLUG"

      - name: Review (fresh context, read-only, budget-capped)
        if: steps.preflight.outputs.capped != 'true'
        id: review
        env:
          # Only the secret the login needs reaches this step.
          FACTORY_SUBSCRIPTION_TOKEN: ${{ env.LOGIN == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          FACTORY_OPENROUTER_KEY: ${{ env.LOGIN == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          MODEL: ${{ vars.FACTORY_REVIEW_MODEL || 'sonnet' }}
          BUDGET_USD: ${{ vars.FACTORY_REVIEW_BUDGET_USD || '2' }}
        run: >-
          uv run --no-dev python -m factory.review_pr review --out review-out
          --login "$LOGIN" --model "$MODEL" --max-budget-usd "$BUDGET_USD"

      # GITHUB_TOKEN has actions: read. The App token used to post the report does not.
      - name: Read CI for this head
        if: steps.preflight.outputs.capped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          uv run --no-dev python -m factory.review_pr ci-conclusion
          --repo "$REPO" --sha "$SHA" --out review-out

      - name: Post the report and move the labels
        if: steps.preflight.outputs.capped != 'true'
        id: apply
        env:
          GH_TOKEN: ${{ steps.preflight.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: uv run --no-dev python -m factory.review_pr apply --repo "$REPO" --pr "$PR" --out review-out

      # Runs after the agent step started, whatever happened, and holds the App token.
      # It takes the run's identity from this workflow's context, never from review-out/,
      # reads the verdict and gate back from the report `apply` posted, and runs only the
      # factory's own scripts from the default-branch checkout, never code under pr/. It adds
      # no secret and no model call. The Review step's outcome goes in as the agent outcome,
      # and apply's as the publish outcome.
      - name: Leave the run record
        if: always() && steps.review.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ steps.preflight.outputs.token }}
          APP_SLUG: ${{ steps.preflight.outputs.app-slug }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Set here, not read from the job's env: a step that can write $GITHUB_ENV
          # could change the job's value before this step runs.
          LOGIN: ${{ vars.FACTORY_CLAUDE_LOGIN || 'subscription' }}
          MODEL: ${{ vars.FACTORY_REVIEW_MODEL || 'sonnet' }}
          BUDGET_USD: ${{ vars.FACTORY_REVIEW_BUDGET_USD || '2' }}
          JOB_STATUS: ${{ job.status }}
          AGENT_OUTCOME: ${{ steps.review.outcome }}
          PUBLISH_OUTCOME: ${{ steps.apply.outcome }}
        run: >-
          uv run --no-dev python -m factory.run_record write --workflow review
          --out review-out --repo "$REPO" --run-id "$RUN_ID" --attempt "$ATTEMPT"
          --pr "$PR" --head-sha "$HEAD_SHA" --login "$LOGIN" --model "$MODEL"
          --budget "$BUDGET_USD" --claude-code-version "$CLAUDE_CODE_VERSION"
          --app-slug "$APP_SLUG" --run-url "$RUN_URL" --job-status "$JOB_STATUS"
          --agent-outcome "$AGENT_OUTCOME" --publish-outcome "$PUBLISH_OUTCOME"

      - name: Keep the review's files with the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-pr${{ github.event.pull_request.number }}-run${{ github.run_id }}-${{ github.run_attempt }}
          path: review-out/
          if-no-files-found: ignore
