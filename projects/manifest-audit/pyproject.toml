[project]
name = "manifest-audit"
version = "0.0.0"
description = "A static Auditor that reports heuristic Findings in local agent manifest files."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manifest_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
