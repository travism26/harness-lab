[project]
name = "harness-lab"
version = "0.0.0"
description = "A small agent harness, built in public by a software factory."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
harness = "harness_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
